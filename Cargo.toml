[package]
name = "clawchorus"
version = "0.1.0"
edition = "2024"

[features]
default = []
_test = []

[dependencies]
acktor = "1.1"
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
rand = "0.9"
reqwest = { version = "0.13", features = [
    "json",
    "rustls",
], default-features = false }
rusqlite = { version = "0.39", features = ["bundled", "column_decltype"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlite-vec = "0.1"
thiserror = "2.0"
toml = "1.1"
tokio = { version = "1.50", features = [
    "fs",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.23", features = ["v4", "serde"] }

[dev-dependencies]
clawchorus = { path = ".", features = ["_test"] }
tempfile = "3"
tower = "0.5"
wiremock = "0.6"
