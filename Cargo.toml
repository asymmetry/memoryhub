[workspace]
members = ["memoryhub", "memoryhub-mcp"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
authors = ["Chao Gu"]
license = "MIT"
repository = "https://github.com/asymmetry/memoryhub"
categories = ["artificial-intelligence", "command-line-utilities"]
keywords = ["ai", "memory"]

[workspace.dependencies]
# dependencies
acktor = "1.1"
ahash = "0.8"
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
rand = "0.10"
reqwest = { version = "0.13", default-features = false }
rmcp = "1.7"
rusqlite = "0.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlite-vec = "0.1"
thiserror = "2.0"
tokio = "1.47"
toml = "1.1"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.23", features = ["v4", "serde"] }

# dev-dependencies
tempfile = "3.0"
tower = "0.5"
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
