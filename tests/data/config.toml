[server]
host = "127.0.0.1"
port = 9090

[memory]
memory_dir = "./test_store"
db_path = ":memory:"
chunk_size = 400
chunk_overlap = 80
temporal_decay_days = 30
hybrid_weight = 0.5

[llm]
provider = "deepseek"
embedding_provider = "openai"
api_key_env = "DEEPSEEK_API_KEY"
embedding_api_key_env = "OPENAI_API_KEY"
model = "deepseek-chat"
embedding_model = "text-embedding-3-small"
